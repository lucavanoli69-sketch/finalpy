{% extends 'base.html' %}

{% block title %}Editar Perfil — BlogAutos{% endblock %}

{% block content %}

<div class="page-header">
    <div class="container">
        <div class="linea-roja"></div>
        <h1>Editar <span>Perfil</span></h1>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div style="background:var(--gris-oscuro); border:1px solid #2a2a2a; border-radius:4px; padding:2rem;">
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-4">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            {% for error in field.errors %}
                                <div class="text-danger mt-1" style="font-size:0.82rem;">{{ error }}</div>
                            {% endfor %}
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-rojo px-4">
                            <i class="bi bi-check-lg me-1"></i>Guardar
                        </button>
                        <a href="{% url 'profile' request.user.username %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
